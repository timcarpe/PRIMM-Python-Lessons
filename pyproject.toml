[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-programming-lessons"
version = "1.0.0"
description = "Compiler and teaching resources for a PRIMM-based Python curriculum"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "lxml==6.1.1",
  "pdf2image==1.17.0",
  "pypdf==6.10.0",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  "ruff>=0.9",
]

[project.scripts]
lesson-compiler = "lesson_compiler.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lesson_compiler = [
  "assets/**/*.png",
  "curriculum/**/*.json",
  "curriculum/**/*.md",
  "slides/*.mjs",
  "templates/**/*.pptx",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
packages = ["lesson_compiler"]
strict = true
