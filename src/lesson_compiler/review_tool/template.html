<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lesson Manifest Review</title>
  <style>
    :root {
      --ink: #19231d;
      --muted: #607067;
      --paper: #fbfaf6;
      --panel: #ffffff;
      --line: #d8ddd8;
      --accent: #176b4d;
      --accent-soft: #e6f3ed;
      --warn: #a24a28;
      --warn-soft: #fff0e9;
      --code: #111b17;
      --code-ink: #eaf4ee;
      --shadow: 0 12px 32px rgba(25, 35, 29, 0.08);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }

    .masthead {
      padding: 42px clamp(20px, 5vw, 72px) 30px;
      color: white;
      background: linear-gradient(125deg, #123f31, #176b4d 70%, #2b8062);
    }
    .masthead-inner, .toolbar-inner, main { max-width: 1500px; margin: 0 auto; }
    .eyebrow { margin: 0 0 8px; opacity: .75; font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(30px, 4vw, 54px); line-height: 1.05; letter-spacing: -.035em; }
    .intro { max-width: 820px; margin: 16px 0 0; color: #d8eee4; font-size: 17px; }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--line);
      background: rgba(251, 250, 246, .96);
      backdrop-filter: blur(12px);
    }
    .toolbar-inner { display: grid; grid-template-columns: minmax(230px, 1fr) auto auto; gap: 12px; align-items: center; padding: 13px clamp(20px, 5vw, 72px); }
    .search { width: 100%; padding: 10px 12px; border: 1px solid #bcc7c0; border-radius: 8px; background: white; }
    .summary { white-space: nowrap; color: var(--muted); font-weight: 700; }
    .actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .button, .file-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 9px 14px;
      border: 1px solid var(--accent);
      border-radius: 8px;
      color: var(--accent);
      background: white;
      font-weight: 800;
      text-decoration: none;
    }
    .button.primary { color: white; background: var(--accent); }
    .button.subtle { color: var(--muted); border-color: #bcc7c0; }
    .button:disabled { cursor: not-allowed; opacity: .45; }
    .file-button input { position: absolute; width: 1px; height: 1px; opacity: 0; }

    main { padding: 28px clamp(20px, 5vw, 72px) 80px; }
    .mode-bar { display: flex; gap: 8px; margin-bottom: 20px; }
    .mode-button { padding: 9px 13px; border: 0; border-radius: 999px; color: var(--muted); background: #e9ece8; font-weight: 800; }
    .mode-button.active { color: white; background: var(--ink); }
    .notice { margin: 0 0 20px; padding: 12px 14px; border: 1px solid #b8d9ca; border-radius: 8px; color: #18563f; background: var(--accent-soft); }
    .notice.error { border-color: #e9b5a2; color: #7b321a; background: var(--warn-soft); }
    .hidden { display: none !important; }

    .lesson {
      margin: 0 0 28px;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: clip;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .lesson-head { display: flex; justify-content: space-between; gap: 18px; align-items: baseline; padding: 20px 24px; border-bottom: 1px solid var(--line); background: #f3f5f1; }
    .lesson h2 { margin: 0; font-size: 23px; letter-spacing: -.02em; }
    .lesson-meta { color: var(--muted); font-size: 13px; }
    .review-grid { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(300px, .55fr); border-bottom: 1px solid var(--line); }
    .review-grid:last-child { border-bottom: 0; }
    .content, .feedback { padding: 20px 24px; }
    .feedback { border-left: 1px solid var(--line); background: #fcfcfa; }
    .item-title { margin: 0 0 12px; font-size: 17px; }
    .prompt { margin: 0; font-size: 16px; line-height: 1.65; }
    pre { margin: 0; padding: 18px; overflow-x: auto; border-radius: 9px; color: var(--code-ink); background: var(--code); font: 14px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; tab-size: 4; }
    .token-call { color: #1750eb; }
    .token-literal { color: #067d17; }
    .token-variable { color: #6a1b9a; background: #eceaf4; padding: 0 .2em; border-radius: 3px; }
    .token-comment { color: #666666; }
    .prompt .token-call, .prompt .token-literal, .prompt .token-variable { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .flag-list { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
    .flag { position: relative; }
    .flag input { position: absolute; opacity: 0; }
    .flag span { display: block; padding: 6px 9px; border: 1px solid #c9d0cb; border-radius: 999px; color: #536159; background: white; font-size: 12px; font-weight: 800; }
    .flag input:checked + span { border-color: var(--warn); color: #8b3d21; background: var(--warn-soft); }
    textarea { width: 100%; min-height: 68px; resize: vertical; padding: 9px 10px; border: 1px solid #c9d0cb; border-radius: 7px; background: white; }
    .review-grid.flagged { box-shadow: inset 4px 0 var(--warn); }

    .empty { padding: 56px 24px; border: 1px dashed #aebbb3; border-radius: 12px; text-align: center; color: var(--muted); background: white; }
    .compare-card { margin-bottom: 20px; border: 1px solid var(--line); border-radius: 12px; overflow: clip; background: white; box-shadow: var(--shadow); }
    .compare-head { display: flex; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); background: #f3f5f1; }
    .compare-head h3 { margin: 0; font-size: 18px; }
    .stale { color: var(--warn); font-weight: 800; }
    .comparison { display: grid; grid-template-columns: 1fr 1fr; }
    .version { min-width: 0; padding: 18px 20px; }
    .version + .version { border-left: 1px solid var(--line); background: #f7fbf8; }
    .version-label { margin: 0 0 9px; color: var(--muted); font-size: 12px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }
    .comparison-text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .decision { display: grid; grid-template-columns: minmax(240px, .35fr) 1fr; gap: 14px; padding: 16px 20px; border-top: 1px solid var(--line); }
    .decision select { width: 100%; padding: 9px; border: 1px solid #c9d0cb; border-radius: 7px; background: white; }
    .rationale { margin: 10px 0 0; color: var(--muted); font-size: 13px; }

    @media (max-width: 920px) {
      .toolbar-inner { grid-template-columns: 1fr; }
      .summary { white-space: normal; }
      .actions { justify-content: flex-start; }
      .review-grid, .comparison, .decision { grid-template-columns: 1fr; }
      .feedback, .version + .version { border-left: 0; border-top: 1px solid var(--line); }
    }
    @media print {
      .toolbar, .mode-bar, .feedback, .decision { display: none; }
      .lesson, .compare-card { break-inside: avoid; box-shadow: none; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <p class="eyebrow">Curriculum quality review</p>
      <h1>Lesson Manifest Review</h1>
      <p class="intro">Review each effective example and challenge, export only identified issues for an agent, then import proposed manifest changes for side-by-side approval.</p>
    </div>
  </header>

  <div class="toolbar">
    <div class="toolbar-inner">
      <input id="search" class="search" type="search" placeholder="Filter by lesson number, title, grade, or content…" aria-label="Filter lessons">
      <div id="summary" class="summary" aria-live="polite"></div>
      <div class="actions">
        <button id="flagged-only" class="button subtle" type="button">Flagged only: off</button>
        <button id="export-issues" class="button primary" type="button">Export issue report</button>
        <button id="export-template" class="button" type="button">Export proposal template</button>
        <label class="file-button">Import proposal<input id="proposal-files" type="file" accept="application/json,.json" multiple></label>
        <button id="export-approval" class="button" type="button" disabled>Export approval</button>
      </div>
    </div>
  </div>

  <main>
    <div class="mode-bar" aria-label="Review mode">
      <button id="review-mode" class="mode-button active" type="button">Flag issues</button>
      <button id="compare-mode" class="mode-button" type="button">Compare proposal <span id="compare-count"></span></button>
    </div>
    <div id="notice" class="notice hidden" role="status"></div>
    <section id="review-view" aria-label="Lesson review"></section>
    <section id="compare-view" class="hidden" aria-label="Proposal comparison"></section>
  </main>

  <script id="lesson-data" type="application/json">__LESSON_REVIEW_DATA__</script>
  <script>
    "use strict";

    const source = JSON.parse(document.getElementById("lesson-data").textContent);
    const storageKey = "lesson-manifest-review:v1:" + source.suite_path;
    const flags = [
      ["clarity", "Clarity"],
      ["styling", "Styling"],
      ["too_easy", "Too easy"],
      ["too_difficult", "Too difficult"],
      ["correctness", "Correctness"],
      ["progression", "Progression"],
      ["other", "Other"]
    ];
    const lessonIndex = new Map(source.lessons.map((lesson) => [Number(lesson.number), lesson]));
    let reviewState = loadState();
    let flaggedOnly = false;
    let proposalChanges = [];
    let proposalFiles = [];

    const reviewView = document.getElementById("review-view");
    const compareView = document.getElementById("compare-view");
    const summary = document.getElementById("summary");
    const notice = document.getElementById("notice");
    const search = document.getElementById("search");

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
      })[character]);
    }

    function renderSegments(segments) {
      return segments.map((segment) => segment.role === "ordinary"
        ? escapeHtml(segment.text)
        : `<span class="token-${segment.role}">${escapeHtml(segment.text)}</span>`
      ).join("");
    }

    function proposedCodeSegments(code) {
      code = code.replaceAll('" )', '")');
      const pattern = /(#[^\n]*|"[^"\n]*"|'[^'\n]*'|\.(?:strip|title|append)\b|\b(?:print|input|int|range|len|def|return|if|elif|else|for|while|and|or|not|in|True|False)\b|(?:==|!=|<=|>=|<|>))/g;
      const segments = [];
      let cursor = 0;
      for (const match of code.matchAll(pattern)) {
        if (match.index > cursor) segments.push({ text: code.slice(cursor, match.index), role: "ordinary" });
        const token = match[0];
        const role = token.startsWith("#") ? "comment"
          : token.startsWith("\"") || token.startsWith("'") ? "literal"
          : token.startsWith(".") || /^(?:print|input|int|range|len|def|return|if|elif|else|for|while|and|or|not|in|True|False)$/.test(token) ? "call"
          : "ordinary";
        segments.push({ text: token, role });
        cursor = match.index + token.length;
      }
      if (cursor < code.length) segments.push({ text: code.slice(cursor), role: "ordinary" });
      return segments.length ? segments : [{ text: code, role: "ordinary" }];
    }

    function proposedPromptSegments(text, functions) {
      const spans = [];
      const add = (start, end, role) => { if (start >= 0 && end > start) spans.push({ start, end, role }); };
      for (const match of text.matchAll(/("[^"\n]*"|“[^”\n]*”|(?<![A-Za-z0-9_])'[^'\n]*'(?![A-Za-z0-9_]))/g)) add(match.index, match.index + match[0].length, "literal");
      const names = [...functions].sort((left, right) => right.length - left.length).map((name) => name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
      if (names.length) {
        const namePattern = names.join("|");
        for (const match of text.matchAll(new RegExp(`\\b(?:${namePattern})(?=\\s*\\()`, "g"))) add(match.index, match.index + match[0].length, "call");
        for (const match of text.matchAll(new RegExp(`\\b(?:${namePattern})\\s*\\(\\s*\\)`, "g"))) add(match.index, match.index + match[0].length, "call");
      }
      for (const match of text.matchAll(/\b[A-Za-z_]\w*\.py\b/g)) add(match.index, match.index + match[0].length, "call");
      for (const match of text.matchAll(/\b[A-Za-z_]\w*\b/g)) {
        if (/^(?:def|return|elif|else|break|continue)$/.test(match[0]) || /^(?:integer|integers|string|strings|list|lists|dictionary|dictionaries|boolean|booleans)$/i.test(match[0])) add(match.index, match.index + match[0].length, "call");
      }
      for (const match of text.matchAll(/\b(?:use|using|add|write|include|with|a|an)\s+(if|for|while)\b/gi)) {
        const start = match.index + match[0].lastIndexOf(match[1]);
        add(start, start + match[1].length, "call");
      }
      for (const match of text.matchAll(/\b(?:if|for|while)\b(?=\s+(?:statement|condition|loop|keyword|branch))/g)) add(match.index, match.index + match[0].length, "call");
      for (const match of text.matchAll(/\b(?:and|or|not|in)\b(?=\s+(?:operator|condition|keyword))/g)) add(match.index, match.index + match[0].length, "call");
      const priority = { literal: 2, call: 1 };
      spans.sort((left, right) => left.start - right.start || priority[right.role] - priority[left.role] || (right.end - right.start) - (left.end - left.start));
      const selected = [];
      for (const span of spans) {
        if (selected.some((other) => !(span.end <= other.start || span.start >= other.end))) continue;
        selected.push(span);
      }
      selected.sort((left, right) => left.start - right.start);
      const segments = [];
      let cursor = 0;
      for (const span of selected) {
        if (span.start > cursor) segments.push({ text: text.slice(cursor, span.start), role: "ordinary" });
        segments.push({ text: text.slice(span.start, span.end), role: span.role });
        cursor = span.end;
      }
      if (cursor < text.length) segments.push({ text: text.slice(cursor), role: "ordinary" });
      return segments.length ? segments : [{ text, role: "ordinary" }];
    }

    function proposedSegments(value, item, lesson) {
      return item.kind === "code"
        ? proposedCodeSegments(value)
        : proposedPromptSegments(value, lesson.functions);
    }

    function itemKey(lessonNumber, field) {
      return `${lessonNumber}:${field}`;
    }

    function loadState() {
      try {
        const value = JSON.parse(localStorage.getItem(storageKey) || "{}");
        return value && typeof value === "object" ? value : {};
      } catch (error) {
        return {};
      }
    }

    function saveState() {
      localStorage.setItem(storageKey, JSON.stringify(reviewState));
    }

    function stateFor(lessonNumber, field) {
      return reviewState[itemKey(lessonNumber, field)] || { flags: [], feedback: "" };
    }

    function isFlagged(lessonNumber, field) {
      const state = stateFor(lessonNumber, field);
      return state.flags.length > 0 || state.feedback.trim().length > 0;
    }

    function identifiedIssues() {
      const issues = [];
      for (const lesson of source.lessons) {
        for (const item of lesson.items) {
          const state = stateFor(lesson.number, item.field);
          if (state.flags.length === 0 && state.feedback.trim() === "") continue;
          issues.push({
            lesson_number: lesson.number,
            lesson_title: lesson.title,
            grade: lesson.grade,
            manifest_path: lesson.manifest_path,
            field: item.field,
            label: item.label,
            flags: state.flags,
            feedback: state.feedback.trim(),
            original_value: item.value
          });
        }
      }
      return issues;
    }

    function renderReview() {
      const term = search.value.trim().toLowerCase();
      const fragments = [];
      let visibleLessons = 0;
      for (const lesson of source.lessons) {
        const lessonFlagged = lesson.items.some((item) => isFlagged(lesson.number, item.field));
        const haystack = [lesson.number, lesson.title, `grade ${lesson.grade}`, ...lesson.items.map((item) => item.value)].join(" ").toLowerCase();
        if ((term && !haystack.includes(term)) || (flaggedOnly && !lessonFlagged)) continue;
        visibleLessons += 1;
        const items = lesson.items.map((item) => renderReviewItem(lesson, item)).join("");
        fragments.push(`<article class="lesson" id="lesson-${lesson.number}"><header class="lesson-head"><h2>Lesson ${String(lesson.number).padStart(2, "0")} · ${escapeHtml(lesson.title)}</h2><div class="lesson-meta">Grade ${lesson.grade} · ${escapeHtml(lesson.manifest_path)}</div></header>${items}</article>`);
      }
      reviewView.innerHTML = fragments.join("") || `<div class="empty">No lessons match the current filter.</div>`;
      const issueCount = identifiedIssues().length;
      summary.textContent = `${visibleLessons} of ${source.lessons.length} lessons · ${issueCount} flagged item${issueCount === 1 ? "" : "s"}`;
      bindReviewControls();
    }

    function renderReviewItem(lesson, item) {
      const state = stateFor(lesson.number, item.field);
      const flagControls = flags.map(([value, label]) => `<label class="flag"><input type="checkbox" value="${value}" ${state.flags.includes(value) ? "checked" : ""}><span>${label}</span></label>`).join("");
      const rendered = item.kind === "code"
        ? `<pre><code>${renderSegments(item.segments)}</code></pre>`
        : `<p class="prompt">${renderSegments(item.segments)}</p>`;
      return `<section class="review-grid ${isFlagged(lesson.number, item.field) ? "flagged" : ""}" data-lesson="${lesson.number}" data-field="${item.field}"><div class="content"><h3 class="item-title">${item.label}</h3>${rendered}</div><div class="feedback"><div class="flag-list" aria-label="Issue flags">${flagControls}</div><textarea aria-label="Written feedback for ${item.label}" placeholder="Optional written feedback…">${escapeHtml(state.feedback)}</textarea></div></section>`;
    }

    function bindReviewControls() {
      for (const row of reviewView.querySelectorAll(".review-grid")) {
        const lessonNumber = Number(row.dataset.lesson);
        const field = row.dataset.field;
        const update = () => {
          const selected = [...row.querySelectorAll('input[type="checkbox"]:checked')].map((input) => input.value);
          const feedback = row.querySelector("textarea").value;
          const key = itemKey(lessonNumber, field);
          if (selected.length || feedback.trim()) reviewState[key] = { flags: selected, feedback };
          else delete reviewState[key];
          row.classList.toggle("flagged", selected.length > 0 || feedback.trim().length > 0);
          saveState();
          const count = identifiedIssues().length;
          summary.textContent = `${reviewView.querySelectorAll(".lesson").length} of ${source.lessons.length} lessons · ${count} flagged item${count === 1 ? "" : "s"}`;
        };
        row.querySelectorAll('input[type="checkbox"]').forEach((input) => input.addEventListener("change", update));
        row.querySelector("textarea").addEventListener("input", update);
      }
    }

    function issueReport() {
      const issues = identifiedIssues();
      return {
        schema_version: "1.0",
        kind: "lesson_manifest_issue_report",
        generated_at: new Date().toISOString(),
        source: { suite_path: source.suite_path, lesson_count: source.lessons.length },
        summary: {
          flagged_item_count: issues.length,
          lessons_affected: [...new Set(issues.map((issue) => issue.lesson_number))]
        },
        issues
      };
    }

    function downloadJson(filename, value) {
      const blob = new Blob([JSON.stringify(value, null, 2) + "\n"], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    }

    function showNotice(message, isError = false) {
      notice.textContent = message;
      notice.classList.remove("hidden");
      notice.classList.toggle("error", isError);
    }

    function sourceItem(lessonNumber, field) {
      const lesson = lessonIndex.get(Number(lessonNumber));
      return lesson && lesson.items.find((item) => item.field === field);
    }

    function proposalTemplate() {
      const report = issueReport();
      return {
        schema_version: "1.0",
        kind: "lesson_manifest_change_proposal",
        based_on: "lesson_manifest_issue_report",
        source_suite: source.suite_path,
        instructions: "Replace each empty new_value with the proposed complete field value. Do not modify old_value.",
        changes: report.issues.map((issue) => ({
          lesson_number: issue.lesson_number,
          manifest_path: issue.manifest_path,
          field: issue.field,
          old_value: issue.original_value,
          new_value: "",
          rationale: ""
        }))
      };
    }

    function changesFromRecord(record, filename) {
      if (!record.lesson || !record.shared_program || !record.worksheet) {
        throw new Error(`${filename} is neither a change proposal nor a lesson manifest.`);
      }
      const lessonNumber = Number(record.lesson.number);
      if (!lessonIndex.has(lessonNumber)) throw new Error(`${filename} uses unknown lesson ${lessonNumber}.`);
      const fields = [{ field: "example_code", value: record.shared_program.code }];
      const challenges = record.worksheet.page2.challenges;
      if (!Array.isArray(challenges) || challenges.length !== 3) throw new Error(`${filename} must contain exactly three worksheet challenges.`);
      challenges.forEach((challenge, index) => fields.push({ field: `challenge_${index + 1}`, value: challenge.prompt }));
      return fields.map((item) => ({ lesson_number: lessonNumber, field: item.field, new_value: item.value, rationale: "", proposal_file: filename }));
    }

    function normalizeChange(change, filename) {
      const lessonNumber = Number(change.lesson_number);
      const item = sourceItem(lessonNumber, change.field);
      if (!item) throw new Error(`${filename} references unknown field ${change.lesson_number}:${change.field}.`);
      if (typeof change.new_value !== "string") throw new Error(`${filename} has a non-text new_value for ${change.lesson_number}:${change.field}.`);
      return {
        lesson_number: lessonNumber,
        field: change.field,
        old_value: typeof change.old_value === "string" ? change.old_value : undefined,
        new_value: change.new_value,
        rationale: typeof change.rationale === "string" ? change.rationale : "",
        proposal_file: filename,
        decision: "pending",
        approval_feedback: ""
      };
    }

    async function importProposal(files) {
      const collected = [];
      const names = [];
      for (const file of files) {
        const parsed = JSON.parse(await file.text());
        const rawChanges = parsed && Array.isArray(parsed.changes)
          ? parsed.changes.map((change) => ({ ...change, proposal_file: file.name }))
          : changesFromRecord(parsed, file.name);
        for (const change of rawChanges) collected.push(normalizeChange(change, file.name));
        names.push(file.name);
      }
      const seen = new Set();
      for (const change of collected) {
        const key = itemKey(change.lesson_number, change.field);
        if (seen.has(key)) throw new Error(`The imported files contain duplicate change ${key}.`);
        seen.add(key);
      }
      proposalChanges = collected.filter((change) => sourceItem(change.lesson_number, change.field).value !== change.new_value);
      proposalFiles = names;
      renderComparison();
      setMode("compare");
      showNotice(`Loaded ${proposalChanges.length} changed field${proposalChanges.length === 1 ? "" : "s"} from ${names.join(", ")}. Unchanged fields are omitted.`);
    }

    function renderComparison() {
      document.getElementById("compare-count").textContent = proposalChanges.length ? `(${proposalChanges.length})` : "";
      document.getElementById("export-approval").disabled = proposalChanges.length === 0;
      if (!proposalChanges.length) {
        compareView.innerHTML = `<div class="empty"><strong>No changed proposal is loaded.</strong><br>Export a proposal template for an agent to complete, or import a change proposal/full revised lesson manifest.</div>`;
        return;
      }
      compareView.innerHTML = proposalChanges.map((change, index) => {
        const lesson = lessonIndex.get(change.lesson_number);
        const item = sourceItem(change.lesson_number, change.field);
        const stale = change.old_value !== undefined && change.old_value !== item.value;
        const oldRendered = renderSegments(item.segments);
        const newRendered = renderSegments(proposedSegments(change.new_value, item, lesson));
        return `<article class="compare-card" data-index="${index}"><header class="compare-head"><h3>Lesson ${String(lesson.number).padStart(2, "0")} · ${escapeHtml(lesson.title)} · ${escapeHtml(item.label)}</h3><span class="${stale ? "stale" : "lesson-meta"}">${stale ? "Base value mismatch" : escapeHtml(change.proposal_file)}</span></header><div class="comparison"><div class="version"><p class="version-label">Current effective manifest</p><p class="comparison-text">${oldRendered}</p></div><div class="version"><p class="version-label">Proposed manifest</p><p class="comparison-text">${newRendered}</p>${change.rationale ? `<p class="rationale"><strong>Rationale:</strong> ${escapeHtml(change.rationale)}</p>` : ""}</div></div><div class="decision"><label><span class="version-label">Decision</span><select><option value="pending" ${change.decision === "pending" ? "selected" : ""}>Pending</option><option value="approved" ${change.decision === "approved" ? "selected" : ""}>Approve</option><option value="changes_requested" ${change.decision === "changes_requested" ? "selected" : ""}>Request changes</option><option value="rejected" ${change.decision === "rejected" ? "selected" : ""}>Reject</option></select></label><label><span class="version-label">Approval feedback</span><textarea placeholder="Optional decision notes…">${escapeHtml(change.approval_feedback)}</textarea></label></div></article>`;
      }).join("");
      compareView.querySelectorAll(".compare-card").forEach((card) => {
        const change = proposalChanges[Number(card.dataset.index)];
        card.querySelector("select").addEventListener("change", (event) => { change.decision = event.target.value; });
        card.querySelector("textarea").addEventListener("input", (event) => { change.approval_feedback = event.target.value; });
      });
    }

    function approvalReport() {
      return {
        schema_version: "1.0",
        kind: "lesson_manifest_approval_report",
        generated_at: new Date().toISOString(),
        source_suite: source.suite_path,
        proposal_files: proposalFiles,
        summary: {
          change_count: proposalChanges.length,
          pending_count: proposalChanges.filter((change) => change.decision === "pending").length
        },
        decisions: proposalChanges.map((change) => {
          const item = sourceItem(change.lesson_number, change.field);
          return {
            lesson_number: change.lesson_number,
            field: change.field,
            old_value: item.value,
            new_value: change.new_value,
            decision: change.decision,
            feedback: change.approval_feedback.trim()
          };
        })
      };
    }

    function setMode(mode) {
      const compare = mode === "compare";
      reviewView.classList.toggle("hidden", compare);
      compareView.classList.toggle("hidden", !compare);
      document.getElementById("review-mode").classList.toggle("active", !compare);
      document.getElementById("compare-mode").classList.toggle("active", compare);
    }

    search.addEventListener("input", renderReview);
    document.getElementById("flagged-only").addEventListener("click", (event) => {
      flaggedOnly = !flaggedOnly;
      event.currentTarget.textContent = `Flagged only: ${flaggedOnly ? "on" : "off"}`;
      renderReview();
    });
    document.getElementById("export-issues").addEventListener("click", () => {
      const report = issueReport();
      if (!report.issues.length) return showNotice("Nothing was exported because no issues are identified yet.", true);
      downloadJson("lesson-manifest-issues.json", report);
      showNotice(`Exported ${report.issues.length} identified issue${report.issues.length === 1 ? "" : "s"}; unflagged items were excluded.`);
    });
    document.getElementById("export-template").addEventListener("click", () => {
      const template = proposalTemplate();
      if (!template.changes.length) return showNotice("Flag at least one item before exporting a proposal template.", true);
      downloadJson("lesson-manifest-change-proposal.json", template);
      showNotice(`Exported an agent-ready proposal template for ${template.changes.length} flagged item${template.changes.length === 1 ? "" : "s"}.`);
    });
    document.getElementById("proposal-files").addEventListener("change", async (event) => {
      try { await importProposal([...event.target.files]); }
      catch (error) { showNotice(error instanceof Error ? error.message : String(error), true); }
      finally { event.target.value = ""; }
    });
    document.getElementById("export-approval").addEventListener("click", () => {
      downloadJson("lesson-manifest-approval.json", approvalReport());
      showNotice("Exported the proposal decisions for agent ingestion.");
    });
    document.getElementById("review-mode").addEventListener("click", () => setMode("review"));
    document.getElementById("compare-mode").addEventListener("click", () => setMode("compare"));

    renderReview();
    renderComparison();
  </script>
</body>
</html>
